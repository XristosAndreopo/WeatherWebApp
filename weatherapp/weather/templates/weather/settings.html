{% extends 'base.html' %}
{% block content %}
<div class="container my-5">
  <div class="card shadow-sm mx-auto" style="max-width: 520px;">
    <div class="card-body">
      <h2 class="card-title mb-3">Settings</h2>

      <form method="post">
        {% csrf_token %}
        <!-- Default City -->
        <div class="mb-3">
          <label for="defaultCity" class="form-label">Default City</label>
          <input
            id="defaultCity"
            name="default_city"
            type="text"
            class="form-control"
            value="{{ preference.default_city }}"
            placeholder="e.g. London"
          >
        </div>

        <!-- Default Country -->
        <div class="mb-3">
          <label for="defaultCountry" class="form-label">Default Country</label>
          <input
            id="defaultCountry"
            name="default_country"
            type="text"
            class="form-control"
            maxlength="2"
            value="{{ preference.default_country }}"
            placeholder="e.g. GB"
          >
          <div class="form-text">ISO 2‑letter code</div>
        </div>

        <!-- Default Units -->
        <div class="mb-3">
          <label for="defaultUnit" class="form-label">Units</label>
          <select id="defaultUnit" name="default_unit" class="form-select">
            <option value="metric"   {% if preference.default_unit == 'metric'   %}selected{% endif %}>Metric (°C)</option>
            <option value="imperial" {% if preference.default_unit == 'imperial' %}selected{% endif %}>Imperial (°F)</option>
          </select>
        </div>

        <!-- Default Theme -->
        <div class="mb-4">
          <label for="defaultTheme" class="form-label">Theme</label>
          <select id="defaultTheme" name="default_theme" class="form-select">
            <option value="light"           {% if preference.default_theme == 'light'           %}selected{% endif %}>🌞 Light</option>
            <option value="light-dark"      {% if preference.default_theme == 'light-dark'      %}selected{% endif %}>🌗 Light Dark</option>
            <option value="dracula"         {% if preference.default_theme == 'dracula'         %}selected{% endif %}>🧛 Dracula</option>
            <option value="high-contrast"   {% if preference.default_theme == 'high-contrast'   %}selected{% endif %}>⚫ High‑Contrast</option>
            <option value="sepia"           {% if preference.default_theme == 'sepia'           %}selected{% endif %}>📜 Sepia</option>
          </select>
        </div>

        <button type="submit" class="btn btn-primary">Save Preferences</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
