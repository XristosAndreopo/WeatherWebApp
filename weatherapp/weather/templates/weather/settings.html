{% extends 'base.html' %}
{% block content %}
<div class="container my-5">
    <div class="card shadow-sm mx-auto" style="max-width: 520px;">
        <div class="card-body">
            <h2 class="card-title mb-3">Settings</h2>
            <ul class="list-group list-group-flush mb-4">
                <!-- Notifications (still coming soon) -->
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    <span><i class="bi bi-bell me-2"></i>Notifications</span>
                    <span class="badge bg-secondary">Coming soon</span>
                </li>
                <!-- Theme switcher -->
                <li class="list-group-item d-flex justify-content-between align-items-center">
                  <span><i class="bi bi-palette me-2"></i>Theme</span>
                  <span>
                    <select id="themeSelect" class="form-select form-select-sm d-inline w-auto">
                      <option value="light">🌞 Light</option>
                      <option value="light-dark">🌗 Light Dark</option>
                      <option value="dracula">🧛 Dracula</option>
                      <option value="high-contrast">⚫ High‑Contrast</option>
                      <option value="sepia">📜 Sepia</option>
                    </select>
                    <button id="applyTheme" class="btn btn-outline-primary btn-sm ms-2">Apply</button>
                  </span>
                </li>
                <!-- Password/Security (still coming soon) -->
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    <span><i class="bi bi-lock me-2"></i>Password/Security</span>
                    <span class="badge bg-secondary">Coming soon</span>
                </li>
            </ul>
            <p class="text-muted text-center mb-0">Profile & settings customization will be added in a future version.</p>
        </div>
    </div>
</div>
{% endblock %}
