{% extends 'base.html' %}
{% load static %}

{% block content %}
<section class="container my-5">
  <h2>Interactive Weather Map</h2>

  <!-- Location search form -->
  <form class="row gx-2 gy-3 mb-4 align-items-end">
    <div class="col-md-5">
      <label for="cityInput" class="form-label">City</label>
      <input
        type="text"
        id="cityInput"
        class="form-control"
        placeholder="e.g. London"
        value="{{ default_city }}"
      >
    </div>
    <div class="col-md-5">
      <label for="countryInput" class="form-label">Country (optional)</label>
      <input
        type="text"
        id="countryInput"
        class="form-control"
        placeholder="e.g. GB / ISO2‑letter code"
        maxlength="10"
        value="{{ default_country }}"
      >
    </div>
    <div class="col-md-2">
      <button id="searchBtn" class="btn btn-primary w-100">Search</button>
    </div>
  </form>

  <!-- The map itself -->
  <div id="map" style="height:400px;"></div>

  <!-- Forecast toggle (hidden until first fetch) -->
  <div
    id="mapForecastControls"
    class="dropdown my-4"
    style="display:none;"
  >
    <button
      class="btn btn-primary dropdown-toggle"
      type="button"
      id="mapForecastDropdown"
      data-bs-toggle="dropdown"
      aria-expanded="false"
    >
      Show: Daily
    </button>
    <ul class="dropdown-menu" aria-labelledby="mapForecastDropdown">
      <li><a class="dropdown-item" href="#" data-forecast="daily">Daily</a></li>
      <li><a class="dropdown-item" href="#" data-forecast="hourly">Next 24 Hrs</a></li>
    </ul>
  </div>

  <!-- Daily forecast cards -->
  <div id="weatherResult" class="mt-3"></div>

  <!-- Hourly chart container -->
  <div
    id="hourlyMapChartContainer"
    style="display:none; margin-top:1rem;"
  >
    <h4>Next 24 Hours</h4>
    <canvas id="hourlyMapChart" height="100"></canvas>
  </div>

  {% if user.is_authenticated %}
    <form
      id="mapAddFavForm"
      method="post"
      action="{% url 'add_favorite' %}"
      style="display:none;"
    >
      {% csrf_token %}
      <input type="hidden" name="city" id="mapAddFavCity">
      <input type="hidden" name="country" id="mapAddFavCountry">
      <button class="btn btn-outline-success mt-3">Add to Favorites</button>
    </form>
  {% endif %}
</section>
{% endblock %}

{% block extra_js %}
  <!-- Chart.js from CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
{% endblock %}
